<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy — Poker Chips</title>
  <link rel="alternate" hreflang="es" href="es.html">
  <link rel="alternate" hreflang="ca" href="ca.html">
  <link rel="alternate" hreflang="en" href="en.html">
  <style>
:root {
  --bg: #fbfaf8; --fg: #1c1b19; --muted: #5c5850;
  --rule: #e2ded7; --accent: #7a1f1f; --card: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a; --fg: #eceaf0; --muted: #a29eab;
    --rule: #2e2c35; --accent: #e08a8a; --card: #1e1d24;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 20px 96px;
  background: var(--bg); color: var(--fg);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main, nav { max-width: 46rem; margin: 0 auto; }
nav {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 18px 0; border-bottom: 1px solid var(--rule); margin-bottom: 28px;
}
nav a {
  padding: 6px 13px; border-radius: 999px; text-decoration: none;
  color: var(--muted); border: 1px solid var(--rule); font-size: 15px;
}
nav a[aria-current] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
h1 { font-size: 1.85rem; line-height: 1.25; margin: 0 0 .4em; letter-spacing: -.02em; }
h2 { font-size: 1.25rem; margin: 2.4em 0 .6em; letter-spacing: -.01em; }
h3 { font-size: 1.02rem; margin: 1.9em 0 .5em; color: var(--accent); }
p, li { color: var(--fg); }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2.6em 0; }
ul { padding-left: 1.15em; }
li { margin: .45em 0; }
table {
  width: 100%; border-collapse: collapse; margin: 1.2em 0;
  background: var(--card); font-size: .95rem;
}
th, td {
  text-align: left; padding: .7em .85em;
  border: 1px solid var(--rule); vertical-align: top;
}
th { font-weight: 600; }
footer {
  max-width: 46rem; margin: 60px auto 0; padding-top: 20px;
  border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px;
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  table { display: block; overflow-x: auto; }
}
/* No nav here to space it off the top, so the chooser supplies its own. */
main { padding-top: 40px; }
  </style>
</head>
<body>
  <main>
    <h1>Poker Chips</h1>
    <p>Privacy policy · Política de privacidad · Política de privacitat</p>
    <ul>

      <li><a href="ca.html">Català</a></li>
      <li><a href="en.html">English</a></li>
    </ul>
  </main>
  <script>
    var by = { es: 'es.html', ca: 'ca.html', en: 'en.html' };
    var want = (navigator.language || 'en').slice(0, 2).toLowerCase();
    location.replace(by[want] || 'en.html');
  </script>
</body>
</html>
